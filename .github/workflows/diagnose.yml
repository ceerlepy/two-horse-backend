name: Part 5 Diagnose

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD"
        required: false
      sources:
        description: "Space-separated source keys (default: all eight)"
        required: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      BASE_URL: https://two-horse-backend.veyseltosun-vt.workers.dev
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      DATE: ${{ inputs.date }}
      SOURCES: ${{ inputs.sources }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Run diagnostics
        run: |
          chmod +x scripts/part5-diagnose.sh
          scripts/part5-diagnose.sh > out.txt 2>&1 || true
          head -c 60000 out.txt > body.txt

      - name: Upload full report artifact
        uses: actions/upload-artifact@v4
        with:
          name: part5-diagnose-full-${{ github.run_number }}
          path: out.txt
          retention-days: 14

      - name: Post issue
        run: |
          {
            echo '```'
            cat body.txt
            echo '```'
            if [ "$(wc -c < out.txt)" -gt "$(wc -c < body.txt)" ]; then
              echo ""
              echo "_Report truncated at 60000 characters (GitHub issue body limit) — the full untruncated output is attached as the \`part5-diagnose-full-${{ github.run_number }}\` workflow artifact on this run._"
            fi
          } > issue.md
          gh issue create \
            --title "Part 5 diagnostics — run ${{ github.run_number }}" \
            --body-file issue.md
